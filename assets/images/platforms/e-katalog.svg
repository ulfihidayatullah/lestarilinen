  <rect width="900" height="360" rx="28" fill="#fff"/>
  <g transform="translate(70 55)">
    <text x="0" y="150" font-family="Georgia, Times New Roman, serif" font-size="178" font-style="italic" fill="#e21f26">e</text>
    <text x="115" y="145" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="500" fill="#555">Katalog</text>
    <text x="120" y="205" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#777">Elektronik</text>
    <g transform="translate(480 215)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#111">L</text>
      <text x="40" y="0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#e21f26">K</text>
      <text x="84" y="0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#111">PP</text>
